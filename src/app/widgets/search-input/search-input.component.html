<div class="search-wrap">
  <input
    type="text"
    class="form-control"
    [placeholder]="placeholder"
    [ngModel]="model"
    (ngModelChange)="modelChange.emit($event)"
    (keyup.enter)="triggerSearch()"
  />
  <button
    type="button"
    class="search-btn"
    aria-label="Search"
    (click)="triggerSearch()"
  >
    <i class="bi bi-search"></i>
  </button>
</div>
