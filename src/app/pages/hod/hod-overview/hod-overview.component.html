<section class="hod-overview-page">
  <section class="overview-card intro-card">
    <h1 class="page-title">Department overview</h1>
    <p class="page-copy">
      Monitor verification workload, lecturer activity, and department review
      progress from one place.
    </p>
  </section>

  <section class="overview-grid">
    @for (metric of overviewMetrics(); track metric.label) {
      <article class="overview-card metric-card">
        <span class="metric-value">{{ metric.value }}</span>
        <span class="metric-label">{{ metric.label }}</span>
      </article>
    }
  </section>
</section>
