<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [dismissableMask]="!loading"
  styleClass="app-modal-shell"
  (onHide)="onClose()"
>
  <ng-template pTemplate="header">
    <div>
      <h2 class="title-small app-modal-title">Record Expense</h2>
      <p class="body-small app-modal-subtitle">
        Log money the institution has already spent.
      </p>
    </div>
  </ng-template>

  <form class="app-modal-content" [formGroup]="form" (ngSubmit)="onSave()">
    <div class="app-modal-divider"></div>

    <label class="app-modal-field">
      <span class="label-small app-modal-label">Title</span>
      <input
        class="app-modal-input"
        type="text"
        formControlName="title"
        placeholder="e.g. Generator diesel — March"
      />
      @if (showError("title")) {
        <small class="field-error">Enter a title (max 150 characters).</small>
      }
    </label>

    <div class="field-row">
      <div class="app-modal-field">
        <span class="label-small app-modal-label">Category</span>
        <p-select
          [options]="categoryOptions"
          formControlName="category"
          optionLabel="label"
          optionValue="value"
          placeholder="Select category"
          styleClass="app-modal-select"
          appendTo="body"
        />
        @if (showError("category")) {
          <small class="field-error">Choose a category.</small>
        }
      </div>

      <label class="app-modal-field">
        <span class="label-small app-modal-label">Amount (₦)</span>
        <input
          class="app-modal-input"
          type="number"
          min="1"
          step="0.01"
          inputmode="decimal"
          formControlName="amount"
        />
        @if (showError("amount")) {
          <small class="field-error">Enter an amount greater than 0.</small>
        }
      </label>
    </div>

    <label class="app-modal-field">
      <span class="label-small app-modal-label">Date spent</span>
      <input
        class="app-modal-input"
        type="date"
        [max]="maxDate"
        formControlName="expense_date"
      />
      @if (showError("expense_date")) {
        <small class="field-error">Pick a date that isn't in the future.</small>
      }
    </label>

    <label class="app-modal-field">
      <span class="label-small app-modal-label">
        Description <span class="optional">(optional)</span>
      </span>
      <textarea
        class="app-modal-input textarea"
        rows="3"
        formControlName="description"
      ></textarea>
    </label>
  </form>

  <ng-template pTemplate="footer">
    <div class="app-modal-actions">
      <app-button
        variant="outline"
        [disabled]="loading"
        [fullWidth]="true"
        (buttonClick)="onClose()"
      >
        Cancel
      </app-button>
      <app-button
        variant="primary"
        [disabled]="loading"
        [fullWidth]="true"
        (buttonClick)="onSave()"
      >
        {{ loading ? "Saving…" : "Save Expense" }}
      </app-button>
    </div>
  </ng-template>
</p-dialog>
