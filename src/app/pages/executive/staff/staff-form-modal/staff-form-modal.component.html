<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [dismissableMask]="!loading"
  styleClass="app-modal-shell"
  (onHide)="onClose()"
>
  <ng-template pTemplate="header">
    <div>
      <h2 class="title-small app-modal-title">
        {{ isEdit ? "Edit Staff" : "Add Staff" }}
      </h2>
      <p class="body-small app-modal-subtitle">
        {{
          isEdit
            ? "Update this staff member’s details and role."
            : "Create a staff account and assign their role."
        }}
      </p>
    </div>
  </ng-template>

  <form class="app-modal-content" [formGroup]="form" (ngSubmit)="onSave()">
    <div class="app-modal-divider"></div>

    <div class="field-row">
      <label class="app-modal-field">
        <span class="label-small app-modal-label">First name</span>
        <input
          class="app-modal-input"
          type="text"
          formControlName="first_name"
        />
        @if (showError("first_name")) {
          <small class="field-error">First name is required.</small>
        }
      </label>
      <label class="app-modal-field">
        <span class="label-small app-modal-label">Last name</span>
        <input
          class="app-modal-input"
          type="text"
          formControlName="last_name"
        />
        @if (showError("last_name")) {
          <small class="field-error">Last name is required.</small>
        }
      </label>
    </div>

    <label class="app-modal-field">
      <span class="label-small app-modal-label">
        Other names <span class="optional">(optional)</span>
      </span>
      <input
        class="app-modal-input"
        type="text"
        formControlName="other_names"
      />
    </label>

    <div class="field-row">
      <label class="app-modal-field">
        <span class="label-small app-modal-label">Email</span>
        <input
          class="app-modal-input"
          type="email"
          autocomplete="off"
          formControlName="email"
        />
        @if (showError("email")) {
          <small class="field-error">Enter a valid email address.</small>
        }
      </label>
      <label class="app-modal-field">
        <span class="label-small app-modal-label">
          Phone <span class="optional">(optional)</span>
        </span>
        <input
          class="app-modal-input"
          type="tel"
          formControlName="phone_number"
        />
        @if (showError("phone_number")) {
          <small class="field-error">Enter a valid phone number.</small>
        }
      </label>
    </div>

    <div class="app-modal-field">
      <span class="label-small app-modal-label">Role</span>
      <p-select
        [options]="staffTypeOptions"
        formControlName="staff_type"
        optionLabel="label"
        optionValue="value"
        placeholder="Select role"
        styleClass="app-modal-select"
        appendTo="body"
      />
      @if (showError("staff_type")) {
        <small class="field-error">Choose a role.</small>
      }
    </div>
  </form>

  <ng-template pTemplate="footer">
    <div class="app-modal-actions">
      <app-button
        variant="outline"
        [disabled]="loading"
        [fullWidth]="true"
        (buttonClick)="onClose()"
      >
        Cancel
      </app-button>
      <app-button
        variant="primary"
        [disabled]="loading"
        [fullWidth]="true"
        (buttonClick)="onSave()"
      >
        {{ loading ? "Saving…" : isEdit ? "Save Changes" : "Add Staff" }}
      </app-button>
    </div>
  </ng-template>
</p-dialog>
